<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650">
  <rect width="1100" height="650" rx="24" fill="#0f172a"/>
  <g font-family="Inter,Arial,sans-serif" fill="#e2e8f0">
