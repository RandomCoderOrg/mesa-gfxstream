duration_ms: 12000
buffers: { size_kb: 32768 fill_policy: RING_BUFFER }
buffers: { size_kb: 4096 fill_policy: RING_BUFFER }

data_sources: {
  config {
    name: "linux.ftrace"
    target_buffer: 0
    ftrace_config {
      ftrace_events: "sched/sched_switch"
      ftrace_events: "sched/sched_waking"
      ftrace_events: "power/cpu_frequency"
      ftrace_events: "power/cpu_idle"
      ftrace_events: "dma_fence/dma_fence_init"
      ftrace_events: "dma_fence/dma_fence_signaled"
      atrace_categories: "binder_driver"
      atrace_categories: "freq"
      atrace_categories: "gfx"
      atrace_categories: "memory"
      atrace_categories: "res"
      atrace_categories: "sched"
      atrace_categories: "view"
      atrace_categories: "webview"
      atrace_apps: "com.termux"
      atrace_apps: "com.termux.x11"
      compact_sched { enabled: true }
    }
  }
}

data_sources: {
  config {
    name: "linux.process_stats"
    target_buffer: 1
    process_stats_config {
      scan_all_processes_on_start: true
      proc_stats_poll_ms: 250
    }
  }
}

data_sources: {
  config {
    name: "linux.sys_stats"
    target_buffer: 1
    sys_stats_config {
      meminfo_period_ms: 250
      vmstat_period_ms: 250
      stat_period_ms: 250
    }
  }
}

data_sources: {
  config {
    name: "android.surfaceflinger.frametimeline"
    target_buffer: 0
  }
}
